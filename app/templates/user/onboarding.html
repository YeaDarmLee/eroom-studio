{% extends "base.html" %}

{% block content %}
<div class="min-h-screen bg-gray-50 flex flex-col justify-center py-12 sm:px-6 lg:px-8">
    <div class="sm:mx-auto sm:w-full sm:max-w-md">
        <h2 class="mt-6 text-center text-3xl font-extrabold text-gray-900">
            이룸 스튜디오에 오신 것을 환영합니다
        </h2>
        <p class="mt-2 text-center text-sm text-gray-600">
            이용 상황에 맞는 항목을 선택해주세요
        </p>
    </div>

    <div class="mt-8 sm:mx-auto sm:w-full sm:max-w-md">
        <div class="bg-white py-8 px-4 shadow sm:rounded-lg sm:px-10 space-y-4">
            <button onclick="selectType('new')"
                class="w-full flex justify-center py-4 px-4 border border-transparent rounded-button text-base font-bold text-white bg-primary hover:bg-primary/90 focus:ring-2 focus:ring-offset-2 focus:ring-primary">
                처음 이용합니다
            </button>

            <div class="relative">
                <div class="absolute inset-0 flex items-center">
                    <div class="w-full border-t border-gray-300"></div>
                </div>
                <div class="relative flex justify-center text-sm">
                    <span class="px-2 bg-white text-gray-500">또는</span>
                </div>
            </div>

            <button onclick="selectType('existing')"
                class="w-full flex justify-center py-4 px-4 border border-gray-300 rounded-button text-base font-medium text-gray-700 bg-white hover:bg-gray-50 focus:ring-2 focus:ring-offset-2 focus:ring-primary">
                이미 이용 중인 계약을 연결합니다
            </button>
        </div>
    </div>
</div>

<script>
    function selectType(type) {
        if (type === 'new') {
            // Call API to update status to new_user_done
            fetch('/api/auth/onboarding', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + localStorage.getItem('token')
                },
                body: JSON.stringify({ type: 'new' })
            }).then(() => {
                window.location.href = '/my/room';
            });
        } else {
            // Redirect to link request form
            window.location.href = '/onboarding/link';
        }
    }
</script>
{% endblock %}
